<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f2f7ff">
  <title>SenditGo Fleet · Product walkthrough</title>
  <link rel="icon" href="./brand/logo.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f2f7ff; color: #101e38; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
    main { width: min(100% - 40px, 1200px); margin: clamp(24px, 5vh, 56px) auto }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; margin-bottom: 22px }
    h1 { display: flex; align-items: center; gap: 12px; margin: 0; font-size: clamp(1.22rem, 3.5vw, 2rem); line-height: 1.15; letter-spacing: -.025em }
    h1 img { width: 38px; height: auto }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 19px; background: #0047d7; color: white; font-weight: 650; text-decoration: none; border-radius: 7px }
    a:hover { background: #0039ae }
    a:focus-visible, video:focus-visible { outline: 3px solid #1750bc; outline-offset: 4px }
    video { display: block; width: 100%; aspect-ratio: 16/9; background: #09141f; border-radius: 8px }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><img src="./brand/logo.svg" alt="">SenditGo Fleet walkthrough</h1>
      <a href="./">Open Fleet demo</a>
    </header>
    <video controls playsinline preload="metadata" poster="./walkthrough/fleet-poster.jpg" aria-label="SenditGo Fleet product walkthrough">
      <source src="./walkthrough/fleet-d8deddb2.mp4" type="video/mp4">
      <track kind="captions" src="./walkthrough/fleet-en.vtt" srclang="en" label="English">
      <a href="./walkthrough/fleet-d8deddb2.mp4">Open the video</a>
    </video>
  </main>
</body>
</html>
