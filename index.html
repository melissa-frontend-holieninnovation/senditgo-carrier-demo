<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071120" media="(prefers-color-scheme: dark)" />
    <style>html{background:#F2F7FF}html[data-theme="dark"]{background:#071120}</style>
    <script>
      // GitHub Pages serves 404.html for deep links; restore the requested URL before the router starts.
      (function () {
        var path = new URLSearchParams(window.location.search).get('__pages_path');
        var base = '/senditgo-fleet-demo/';
        if (path && path.startsWith(base) && !path.startsWith('//')) {
          window.history.replaceState(window.history.state, '', path);
        }
      })();
      // Sets the theme before first paint so the page never flashes. Same rule as resolveTheme in src/theme/useThemeStore.ts:
      // 'tms:theme-mode' holds light or dark; no entry means follow the device.
      (function () {
        var mode = 'light';
        try {
          var stored = window.localStorage.getItem('tms:theme-mode');
          if (stored === 'light' || stored === 'dark') mode = stored;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.style.colorScheme = mode;
      })();
    </script>
    <!-- The display face. Saira is loaded from Google Fonts; no font file is kept in this repository. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@1,125,700&display=swap" />
    <title>SenditGo Fleet Web V3 Prototype</title>
    <script type="module" crossorigin src="/senditgo-fleet-demo/assets/index-Kwrjtksq.js"></script>
    <link rel="stylesheet" crossorigin href="/senditgo-fleet-demo/assets/index-Dl2rCt2n.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
